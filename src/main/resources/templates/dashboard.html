<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bibliométrico - IA Generativa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Librerías de Gráficos Externas -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <style>
        .chart-container { height: 400px; margin-bottom: 30px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.05); border: none; border-radius: 12px; }
        .stat-value { font-weight: bold; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-graph-up"></i> Análisis de IA Generativa en Educación
            </span>
        </div>
    </nav>

    <div class="container">
        <!-- Tarjetas de Resumen -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-center p-4">
                    <h6 class="text-muted text-uppercase">Total Procesados</h6>
                    <p class="display-5 text-dark stat-value" th:text="${resumen.total_procesados}">0</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-4">
                    <h6 class="text-muted text-uppercase">Artículos Únicos</h6>
                    <p class="display-5 text-success stat-value" th:text="${resumen.unicos_guardados}">0</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-4">
                    <h6 class="text-muted text-uppercase">Precisión del Algoritmo</h6>
                    <p class="display-5 text-info stat-value" th:text="${resumen.precision_descubrimiento_ia}">0%</p>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Mapa Geográfico -->
            <div class="col-lg-7">
                <div class="card p-3 mb-4">
                    <h5 class="card-title p-2 border-bottom">Distribución Geográfica (Heatmap)</h5>
                    <div id="geoMap" class="chart-container"></div>
                </div>
            </div>
            <!-- Línea Temporal -->
            <div class="col-lg-5">
                <div class="card p-3 mb-4">
                    <h5 class="card-title p-2 border-bottom">Tendencia de Publicación</h5>
                    <div class="chart-container">
                        <canvas id="timelineChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Nube de Palabras -->
            <div class="col-12">
                <div class="card p-3 mb-4 text-center">
                    <h5 class="card-title text-start p-2 border-bottom">Nube de Conceptos Emergentes (NLP)</h5>
                    <canvas id="wordCloudCanvas" style="width: 100%; height: 350px;"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Inicialización (Puente entre Thymeleaf y JS Externo) -->
    <script th:inline="javascript">
        /* Inyectamos los datos del servidor en una variable global segura */
        const dashboardData = /*[[${resumen}]]*/ {};
        
        // Esperamos a que el DOM esté listo para inicializar los gráficos
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initDashboard === 'function') {
                initDashboard(dashboardData);
            }
        });
    </script>

    <!-- JS Personalizado Separado -->
    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
