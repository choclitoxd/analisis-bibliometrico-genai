<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bibliométrico | IA Generativa</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Librerías de Gráficos (Versión Desarrollo para mejor diagnóstico) -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>

    <!-- Estilos Personalizados Externos -->
    <link rel="stylesheet" th:href="@{/css/dashboard-style.css}">
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                Bibliometria<span>AI</span>
            </div>
            <div class="nav-actions">
                <p style="font-size: 0.85rem; color: var(--text-med);">
                    Query: <span th:text="${resumen.query}" style="color: var(--accent); font-weight: 600;">generative artificial intelligence</span>
                </p>
            </div>
        </div>
    </nav>

    <main class="container">
        
        <!-- Stat Cards -->
        <section class="stat-grid">
            <article class="card">
                <p class="stat-label">Total Procesados</p>
                <div class="stat-value" th:text="${resumen.total_procesados}">0</div>
            </article>
            <article class="card">
                <p class="stat-label">Artículos Únicos</p>
                <div class="stat-value success" th:text="${resumen.unicos_guardados}">0</div>
            </article>
            <article class="card">
                <p class="stat-label">Precisión IA</p>
                <div class="stat-value accent" th:text="${resumen.precision_descubrimiento_ia}">0%</div>
            </article>
        </section>

        <!-- Charts Section -->
        <div class="charts-grid">
            <section class="card">
                <header class="chart-header">
                    <h5 class="chart-title">Distribución Geográfica (Heatmap)</h5>
                </header>
                <div id="geoMap" class="chart-container"></div>
            </section>

            <section class="card">
                <header class="chart-header">
                    <h5 class="chart-title">Tendencia de Publicación</h5>
                </header>
                <div class="chart-container">
                    <canvas id="timelineChart"></canvas>
                </div>
            </section>
        </div>

        <!-- Word Cloud -->
        <section class="card cloud-card">
            <header class="chart-header">
                <h5 class="chart-title">Nube de Conceptos Emergentes (NLP)</h5>
            </header>
            <canvas id="wordCloudCanvas"></canvas>
        </section>

    </main>

    <!-- Script de Inicialización -->
    <script th:inline="javascript">
        const dashboardData = /*[[${resumen}]]*/ {};
        
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initDashboard === 'function') {
                initDashboard(dashboardData);
            }
        });
    </script>

    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
